name: Publish index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish new build as index.html
        run: |
          set -e
          test -f webflowai-new-build.html
          mv webflowai-new-build.html index.html
          rm -rf .github
          git config user.name "elevatejewels-hq"
          git config user.email "elevatejewels-hq@users.noreply.github.com"
          git add -A
          git commit -m "WebFlowAI latest build — Pro workspace, phone sign-in, new ending"
          git push

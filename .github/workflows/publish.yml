name: Publish staging build to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move staging build onto index.html
        run: |
          mv webflowai.html index.html
          rm .github/workflows/publish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "WebFlowAI — Brand kits and Download .html"
          git push
